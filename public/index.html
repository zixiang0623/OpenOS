<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>OpenOS</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* Hallmark stamp: OpenOS desktop mockup. Material inherited from Workline (cool paper h235, teal accent, JetBrains Mono data face), rebuilt as OS glass. Waiver 47a: windows are the product itself, not drawn chrome. Color only through tokens. */
:root{
--paper:oklch(98.5% .004 235);--paper-2:oklch(96.2% .006 235);--paper-3:oklch(93.2% .008 235);
--ink:oklch(23% .02 250);--ink-2:oklch(40% .02 250);--muted:oklch(47% .016 250);--rule:oklch(90% .008 240);
--accent:oklch(50% .115 205);--accent-ink:oklch(98.5% .004 235);--accent-soft:oklch(94.5% .035 205);
--error:oklch(52% .19 27);
--glass:color-mix(in oklab,var(--paper) 74%,transparent);--glass-2:color-mix(in oklab,var(--paper) 88%,transparent);
--shadow:color-mix(in oklab,var(--ink) 22%,transparent);
--k-files:oklch(52% .11 205);--k-term:oklch(52% .17 28);--k-notes:oklch(55% .14 60);--k-set:oklch(50% .15 275);--k-calc:oklch(52% .12 135);--k-mon:oklch(52% .15 245);--k-web:oklch(52% .14 235);
--sky-a:oklch(90% .05 215);--sky-b:oklch(96% .035 85);--sun:oklch(97% .05 80);
--ridge-1:oklch(82% .05 205);--ridge-2:oklch(72% .075 205);--ridge-3:oklch(58% .09 210);--ridge-4:oklch(42% .08 225);
--font-body:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic UI","Noto Sans JP",system-ui,sans-serif;
--font-data:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
--ease:cubic-bezier(.16,1,.3,1);--bar:34px;
}
[data-theme=dark]{
--paper:oklch(21% .02 250);--paper-2:oklch(25% .022 250);--paper-3:oklch(30% .024 250);
--ink:oklch(96% .006 235);--ink-2:oklch(82% .01 240);--muted:oklch(72% .014 245);--rule:oklch(34% .02 250);
--accent:oklch(76% .11 205);--accent-ink:oklch(20% .02 250);--accent-soft:oklch(32% .045 210);
--shadow:color-mix(in oklab,oklch(0% 0 0) 55%,transparent);
--k-files:oklch(78% .11 205);--k-term:oklch(76% .14 28);--k-notes:oklch(80% .13 75);--k-set:oklch(78% .12 280);--k-calc:oklch(78% .13 145);--k-mon:oklch(78% .12 245);--k-web:oklch(78% .12 235);
--sky-a:oklch(30% .05 255);--sky-b:oklch(44% .07 300);--sun:oklch(88% .07 70);
--ridge-1:oklch(40% .06 260);--ridge-2:oklch(33% .06 250);--ridge-3:oklch(27% .05 245);--ridge-4:oklch(20% .04 245);
}
*{box-sizing:border-box;margin:0}
html,body{height:100%;overflow-x:clip;background:var(--paper-3);color:var(--ink);font:400 14px/1.5 var(--font-body);-webkit-font-smoothing:antialiased;user-select:none}
button,input,textarea{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
svg.ic{width:1em;height:1em;flex:none;stroke-width:1.75}
.mono{font-family:var(--font-data);font-variant-numeric:tabular-nums}
#screen{position:fixed;inset:0;overflow:hidden}
#wall{position:absolute;inset:0;width:100%;height:100%}
.glass{background:var(--glass);backdrop-filter:blur(28px) saturate(1.5);-webkit-backdrop-filter:blur(28px) saturate(1.5);border:1px solid color-mix(in oklab,var(--ink) 9%,transparent)}
/* menu bar */
#bar{position:absolute;inset:0 0 auto;height:var(--bar);padding:0 10px;display:flex;align-items:center;justify-content:space-between;z-index:9000;border-width:0 0 1px}
#bar>div{display:flex;align-items:center;gap:2px}
.bb{height:26px;min-width:28px;padding:0 9px;border-radius:7px;display:inline-flex;align-items:center;gap:7px;font-size:13px;transition:background-color 90ms}
.bb:hover,.bb:active,.bb[aria-expanded=true]{background:color-mix(in oklab,var(--ink) 11%,transparent)}
.bb.b{font-weight:700}.bb svg{font-size:16px}
/* windows */
.win{position:absolute;left:0;top:0;display:flex;flex-direction:column;border-radius:14px;overflow:hidden;background:var(--glass-2);box-shadow:0 1px 0 color-mix(in oklab,var(--paper) 60%,transparent) inset,0 18px 50px -12px var(--shadow),0 2px 8px -2px var(--shadow);transform-origin:50% 50%}
.win:not(.on){box-shadow:0 8px 24px -10px var(--shadow)}
.tb{height:42px;flex:none;display:flex;align-items:center;padding:0 8px 0 14px;gap:8px;cursor:grab;touch-action:none;border-bottom:1px solid var(--rule)}
.tb:active{cursor:grabbing}
.tb h2{flex:1;font-size:13px;font-weight:500;color:var(--ink-2);display:flex;align-items:center;gap:8px}
.win:not(.on) .tb h2{color:var(--muted)}
.wc{display:flex;gap:2px}
.wc button{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;font-size:15px;color:var(--ink-2);transition:background-color 90ms}
.wc button:hover,.wc button:active{background:color-mix(in oklab,var(--ink) 11%,transparent)}
.wc button.x:hover,.wc button.x:active{background:var(--error);color:var(--accent-ink)}
.body{flex:1;min-height:0;display:flex;position:relative}
.rz{position:absolute;right:0;bottom:0;width:18px;height:18px;cursor:nwse-resize;touch-action:none}
/* dock */
#dock{position:absolute;left:50%;bottom:14px;translate:-50% 0;padding:8px 10px;border-radius:24px;display:flex;align-items:flex-end;gap:10px;z-index:9000;box-shadow:0 14px 40px -14px var(--shadow)}
.di{position:relative;width:52px;height:52px;border-radius:15px;display:grid;place-items:center;font-size:26px;color:var(--kc);background:color-mix(in oklab,var(--kc) 13%,var(--paper));border:1px solid color-mix(in oklab,var(--kc) 22%,transparent);transform-origin:50% 100%}
.di:active{filter:brightness(.94)}
.di[data-run]::after{content:"";position:absolute;bottom:-6px;left:50%;width:14px;height:2px;margin-left:-7px;border-radius:2px;background:var(--ink-2)}
.tip{position:absolute;bottom:calc(100% + 12px);left:50%;translate:-50% 0;padding:3px 9px;border-radius:7px;font-size:12px;white-space:nowrap;background:var(--ink);color:var(--paper);opacity:0;pointer-events:none;transition:opacity 90ms}
.di:hover .tip,.di:focus-visible .tip{opacity:1}
/* popovers */
.pop{position:absolute;z-index:9500;border-radius:16px;padding:14px;box-shadow:0 20px 50px -14px var(--shadow);visibility:hidden}
#qs{top:calc(var(--bar) + 8px);right:10px;width:280px;display:grid;gap:12px}
.lbl{font-size:12px;color:var(--muted)}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:3px;padding:3px;border-radius:10px;background:var(--paper-3)}
.seg button{height:32px;border-radius:7px;display:flex;align-items:center;justify-content:center;gap:6px;font-size:13px;color:var(--ink-2)}
.seg button[aria-pressed=true]{background:var(--paper);color:var(--ink);box-shadow:0 1px 3px var(--shadow)}
#sp{inset:18vh 0 auto;margin:0 auto;width:min(560px,92vw);padding:8px}
#sp .in{display:flex;align-items:center;gap:10px;padding:8px 10px;font-size:18px;color:var(--muted)}
#sp input{flex:1;background:none;border:0;outline:0;font-size:17px;color:var(--ink);user-select:text}
#sp ul{list-style:none;padding:0;margin:4px 0 0}
#sp li button{width:100%;display:flex;align-items:center;gap:12px;padding:9px 10px;border-radius:10px;text-align:left;color:var(--ink)}
#sp li button svg{font-size:20px;color:var(--kc)}
#sp li[aria-selected=true] button{background:var(--accent-soft)}
/* apps */
.side{width:176px;flex:none;padding:10px 8px;border-right:1px solid var(--rule);display:grid;gap:2px;align-content:start}
.side button,.row{display:flex;align-items:center;gap:10px;height:34px;padding:0 10px;border-radius:8px;font-size:13px;color:var(--ink-2);text-align:left}
.side button svg{font-size:16px;color:var(--k-files)}
.side button[aria-current=true]{background:var(--accent-soft);color:var(--ink)}
.grid{flex:1;padding:14px;display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:6px;align-content:start;overflow:auto}
.fi{display:grid;justify-items:center;gap:6px;padding:12px 6px 8px;border-radius:10px;font-size:12px;text-align:center;overflow-wrap:anywhere;min-width:0}
.fi svg{font-size:38px;color:var(--k-files)}
.fi:hover,.fi:focus-visible{background:var(--paper-3)}
.fi[aria-selected=true]{background:var(--accent-soft)}
.term{flex:1;padding:12px 14px;font:13px/1.65 var(--font-data);overflow:auto;background:color-mix(in oklab,var(--ink) 92%,transparent);color:oklch(92% .02 190);user-select:text}
.term .p{color:oklch(78% .12 190)}.term .d{color:oklch(68% .02 250)}
.term input{background:none;border:0;outline:0;font:inherit;color:inherit;width:60%;caret-color:oklch(78% .12 190)}
.note{flex:1;padding:16px 18px;background:none;border:0;outline:0;resize:none;line-height:1.8;font-size:15px;user-select:text}
.set{flex:1;padding:20px;display:grid;gap:18px;align-content:start;overflow:auto}
.set h3{font-size:15px;font-weight:700}
.set dl{display:grid;grid-template-columns:auto 1fr;gap:6px 18px;font-size:13px}.set dt{color:var(--muted)}
.calc{flex:1;display:grid;grid-template-rows:84px 1fr;padding:12px;gap:10px}
.calc output{display:flex;align-items:flex-end;justify-content:flex-end;padding:0 8px 6px;font:500 34px var(--font-data);overflow:hidden}
.keys{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.keys button{border-radius:10px;background:var(--paper-3);font:500 17px var(--font-data);transition:background-color 90ms}
.keys button:active{background:var(--accent-soft)}
.keys .o{background:var(--accent-soft);color:var(--accent)}.keys .e{background:var(--accent);color:var(--accent-ink)}
#wsb{display:flex;gap:2px}#wsb button{height:26px;min-width:28px;border-radius:7px;font:500 12px var(--font-data);color:var(--ink-2);transition:background-color 90ms}
#wsb button:hover{background:color-mix(in oklab,var(--ink) 11%,transparent)}
#wsb button[aria-selected=true]{background:var(--accent-soft);color:var(--accent)}
#snap{position:absolute;left:0;top:0;border-radius:14px;border:2px solid var(--accent);background:color-mix(in oklab,var(--accent) 14%,transparent);z-index:8000;opacity:0;pointer-events:none}
.pwr{display:flex;justify-content:flex-end;gap:4px;padding:8px 4px 0;margin-top:6px;border-top:1px solid var(--rule)}
.pwr button{height:32px;padding:0 12px;border-radius:8px;display:flex;align-items:center;gap:7px;font-size:13px;color:var(--ink-2)}
.pwr button:hover{background:var(--paper-3)}
#qt{position:absolute;left:0;right:0;top:var(--bar);height:42vh;z-index:9400;display:flex;visibility:hidden;border-radius:0 0 16px 16px;overflow:hidden;box-shadow:0 20px 50px -14px var(--shadow)}
.term pre{font:inherit;margin:0}
.mon{flex:1;display:grid;overflow:auto;padding:14px 16px;gap:14px;align-content:start}.mm{display:grid;gap:8px}
.mt{display:grid;grid-template-columns:72px 1fr 76px;gap:10px;align-items:center;font-size:12px}.mt i{height:10px;border-radius:3px;background:var(--paper-3);overflow:hidden}.mt i b{display:block;height:100%;background:var(--accent);transform-origin:0 50%}
table{width:100%;border-collapse:collapse;font-size:13px}th{text-align:left;font-weight:500;color:var(--muted);padding:4px 6px;border-bottom:1px solid var(--rule)}td{padding:6px;border-bottom:1px solid var(--rule)}td button{color:var(--error);font-size:12px}
kbd{font:12px var(--font-data);padding:1px 6px;border-radius:5px;background:var(--paper-3)}
#toast{position:absolute;top:calc(var(--bar) + 10px);left:50%;translate:-50% 0;max-width:80vw;padding:8px 14px;border-radius:12px;font-size:13px;z-index:9600;opacity:0;pointer-events:none}
#setup{position:absolute;inset:0;z-index:19000;display:grid;place-items:center;background:color-mix(in oklab,var(--paper) 58%,transparent);backdrop-filter:blur(34px) saturate(1.4);-webkit-backdrop-filter:blur(34px) saturate(1.4)}
#setup .sc{width:min(540px,88vw);display:grid;gap:20px;justify-items:center;text-align:center;user-select:text}
#setup h1{font-size:clamp(30px,6vw,52px);font-weight:500;line-height:1.2;overflow-wrap:break-word;min-width:0}
#setup p{color:var(--ink-2);max-width:40ch}
#setup input{width:min(320px,100%);height:46px;padding:0 14px;border-radius:12px;border:1px solid var(--rule);background:var(--glass-2);font-size:16px;text-align:center;outline-offset:2px}
#setup input[hidden]{display:none}
.opts{display:flex;gap:10px}.opts button{width:150px;height:96px;border-radius:16px;display:grid;place-items:center;align-content:center;gap:6px;background:var(--glass-2);border:1px solid var(--rule);font-size:14px;transition:background-color 90ms,border-color 90ms}.opts button svg{font-size:26px}.opts button[aria-pressed=true]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.big{height:46px;padding:0 26px;border-radius:12px;background:var(--accent);color:var(--accent-ink);font-weight:500;display:inline-flex;align-items:center;gap:8px}.big:active{transform:scale(.97)}
.stp{position:absolute;bottom:34px;display:flex;gap:6px}.stp i{width:22px;height:3px;border-radius:2px;background:var(--rule)}.stp i.on{background:var(--accent)}
.web{flex:1;display:flex;flex-direction:column;min-width:0;position:relative}
.wt{display:flex;align-items:center;gap:2px;padding:6px 8px;border-bottom:1px solid var(--rule)}
.wt button{width:32px;height:32px;flex:none;border-radius:8px;display:grid;place-items:center;font-size:16px;color:var(--ink-2);transition:background-color 90ms}.wt button:hover{background:color-mix(in oklab,var(--ink) 11%,transparent)}.wt button:disabled{opacity:.35;pointer-events:none}
.ad{flex:1;margin:0 6px;min-width:0}.ad input,.px input{width:100%;height:32px;padding:0 12px;border-radius:9px;border:1px solid var(--rule);background:var(--paper-2);font:13px var(--font-data);outline-offset:1px;user-select:text}
.px{display:flex;gap:6px;padding:6px 10px;border-bottom:1px solid var(--rule)}.px[hidden]{display:none}.sv{padding:0 14px;border-radius:9px;background:var(--accent);color:var(--accent-ink);font-size:13px}
.pg{position:absolute;left:0;right:0;top:45px;height:2px;background:var(--accent);transform:scaleX(0);transform-origin:0 50%;opacity:0;z-index:2}
.web iframe{flex:1;border:0;background:var(--paper);width:100%;min-height:0}
/* boot */
#boot{position:absolute;inset:0;z-index:20000;background:var(--paper);display:grid;place-items:center;align-content:center;gap:18px;cursor:pointer}
#boot svg{font-size:68px;color:var(--accent);stroke-width:1.25}
#boot b{font-size:22px;font-weight:500;letter-spacing:.01em}
@media (max-width:640px){.side{display:none}#dock{gap:6px;padding:6px 8px}.di{width:44px;height:44px;font-size:22px}}
@media (prefers-reduced-motion:reduce){*{transition-duration:1ms!important}}
</style></head>
<body>
<main id="screen">
<svg id="wall" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
<defs><linearGradient id="sk" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--sky-a)"/><stop offset="1" stop-color="var(--sky-b)"/></linearGradient></defs>
<rect width="1600" height="900" fill="url(#sk)"/>
<circle id="sun" cx="1130" cy="440" r="86" fill="var(--sun)"/>
<path fill="var(--ridge-1)" d="M0 560C180 500 330 470 520 520S860 560 1040 500 1400 450 1600 520V900H0Z"/>
<path fill="var(--ridge-2)" d="M0 640C220 570 380 600 600 620S980 560 1200 590 1500 610 1600 580V900H0Z"/>
<path fill="var(--ridge-3)" d="M0 720C260 660 420 700 700 710S1100 650 1320 690 1520 720 1600 700V900H0Z"/>
<path fill="var(--ridge-4)" d="M0 800C300 760 520 790 800 800S1200 760 1600 790V900H0Z"/>
</svg>
<header id="bar" class="glass">
<div><button class="bb b" id="bLogo" aria-label="OpenOS メニュー"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.341 6.484A10 10 0 0 1 10.266 21.85" /><path d="M3.659 17.516A10 10 0 0 1 13.74 2.152" /><circle cx="12" cy="12" r="3" /><circle cx="19" cy="5" r="2" /><circle cx="5" cy="19" r="2" /></svg>OpenOS</button><span class="bb" id="appName" style="pointer-events:none">デスクトップ</span></div>
<div id="wsb" role="tablist" aria-label="ワークスペース"></div>
<div><button class="bb" id="bSp" aria-label="検索"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m21 21-4.34-4.34" /><circle cx="11" cy="11" r="8" /></svg></button><button class="bb" id="bVnc" aria-label="リモート画面 (VNC)"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 10 3-3 3 3" /><path d="M12 13V7" /><rect width="20" height="14" x="2" y="3" rx="2" /><path d="M12 17v4" /><path d="M8 21h8" /></svg></button><span class="bb"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h.01" /><path d="M2 8.82a15 15 0 0 1 20 0" /><path d="M5 12.859a10 10 0 0 1 14 0" /><path d="M8.5 16.429a5 5 0 0 1 7 0" /></svg></span><span class="bb"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 10v4" /><path d="M14 10v4" /><path d="M22 14v-4" /><path d="M6 10v4" /><rect x="2" y="6" width="16" height="12" rx="2" /></svg></span><button class="bb mono" id="bQs" aria-expanded="false" aria-controls="qs"><span id="clock">--:--</span><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 5H3" /><path d="M12 19H3" /><path d="M14 3v4" /><path d="M16 17v4" /><path d="M21 12h-9" /><path d="M21 19h-5" /><path d="M21 5h-7" /><path d="M8 10v4" /><path d="M8 12H3" /></svg></button></div>
</header>
<section id="qs" class="pop glass" aria-label="クイック設定">
<div class="lbl">外観</div>
<div class="seg" id="segTheme"><button data-v="light" aria-pressed="true"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4" /><path d="M12 2v2" /><path d="M12 20v2" /><path d="m4.93 4.93 1.41 1.41" /><path d="m17.66 17.66 1.41 1.41" /><path d="M2 12h2" /><path d="M20 12h2" /><path d="m6.34 17.66-1.41 1.41" /><path d="m19.07 4.93-1.41 1.41" /></svg>ライト</button><button data-v="dark" aria-pressed="false"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.985 12.486a9 9 0 1 1-9.473-9.472c.405-.022.617.46.402.803a6 6 0 0 0 8.268 8.268c.344-.215.825-.004.803.401" /></svg>ダーク</button></div>
<div class="lbl">サウンド</div>

$('#pOff').onclick=()=>{togSp(false);const d=H('<div id="boot" style="background:var(--ink);z-index:30000"><b style="color:var(--paper)">電源オフ。クリックで起動</b></div>');d.onclick=()=>location.reload();$('#screen').append(d);gsap.from(d,{opacity:0,duration:.6})};
addEventListener('keydown',e=>{const k=e.key,ca=e.ctrlKey&&e.altKey;if(k==='Escape'&&qtOn)togQt(false);else if(ca&&(k==='ArrowLeft'||k==='ArrowRight')){e.preventDefault();const n=ws+(k==='ArrowRight'?1:-1);if(e.shiftKey&&act&&wins[act]&&n>=0&&n<4)wins[act].ws=n;setWs(n)}else if(e.altKey&&!e.ctrlKey&&k>='1'&&k<='4')setWs(+k-1);else if(ca&&k.toLowerCase()==='t'){e.preventDefault();open('term')}else if(e.ctrlKey&&e.code==='Backquote'){e.preventDefault();togQt()}else if(e.metaKey&&(k==='ArrowLeft'||k==='ArrowRight'||k==='ArrowUp')&&act&&wins[act]){e.preventDefault();snapTo(wins[act],k==='ArrowLeft'?'l':k==='ArrowRight'?'r':'m')}});
const toast=t=>{const e=$('#toast');e.textContent=t;gsap.killTweensOf(e);gsap.fromTo(e,{opacity:0,y:-8},{opacity:1,y:0,duration:RM?0:.3,ease:'expo.out'});gsap.to(e,{opacity:0,duration:.3,delay:2.4})};
const save=()=>{try{localStorage.setItem('openos',JSON.stringify({u:USER,t:document.documentElement.dataset.theme,s:sound,v:vnc.on,p:vnc.pw}))}catch(e){}};
const setVnc=(v,q)=>{vnc.on=v;$$('#segVnc button').forEach(b=>b.setAttribute('aria-pressed',(b.dataset.v==='1')===v));$('#vncInfo').textContent=v?'openos.local:5900':'停止中';$('#bVnc').style.opacity=v?1:.45;if(!q){pop(520);toast(v?'VNCを有効にしました':'VNCを停止しました');save()}};
const sync=()=>{setVnc(vnc.on,1);$$('#segSnd button').forEach(b=>b.setAttribute('aria-pressed',(b.dataset.v==='1')===sound))};
$('#segVnc').onclick=e=>{const b=e.target.closest('button');if(b)setVnc(b.dataset.v==='1')};$('#bVnc').onclick=e=>{e.stopPropagation();togQs()};
if(SS){setTheme(SS.t);sound=SS.s!==false}sync();
/* first run */
function runSetup(done){const el=H('<section id="setup" role="dialog" aria-label="初期設定"><div class="sc"></div><div class="stp"></div></section>');$('#screen').append(el);gsap.from(el,{opacity:0,duration:RM?0:.6});
const sc=$('.sc',el),stp=$('.stp',el),G=['こんにちは','Hello','Bonjour','Hola','안녕하세요','你好','Ciao','Olá'];let i=0,iv,busy=0;
const tg=(id,k,on)=>{const m=()=>$$('#'+id+' button').forEach(b=>b.setAttribute('aria-pressed',on(b.dataset.v)));m();$('#'+id).onclick=e=>{const b=e.target.closest('button');if(b){k(b.dataset.v);m();pop(520)}}};
const S=[
{h:'<span id="gr">こんにちは</span>',p:'OpenOSへようこそ。いくつか設定して始めましょう。',b:'はじめる',f(){let g=0;iv=setInterval(()=>{g=(g+1)%G.length;const e=$('#gr');if(!e)return;gsap.to(e,{opacity:0,y:-10,duration:.25,onComplete:()=>{e.textContent=G[g];gsap.fromTo(e,{opacity:0,y:10},{opacity:1,y:0,duration:.45,ease:'expo.out'})}})},1600)}},
{h:'お名前を教えてください',x:()=>`<input id="sn" value="${USER}" maxlength="16" autocomplete="off" aria-label="ユーザー名">`,b:'続ける',f(){$('#sn').focus();$('#sn').select()},n(){USER=$('#sn').value.trim().replace(/[<>"'&\s]/g,'')||'dar'}},
{h:'外観を選びます',x:()=>`<div class="opts" id="ot"><button data-v="light">${ic('sun')}ライト</button><button data-v="dark">${ic('moon')}ダーク</button></div>`,b:'続ける',f(){tg('ot',setTheme,v=>v===document.documentElement.dataset.theme)}},
{h:'サウンドはどうしますか',p:'操作音はコードで合成した、短くて柔らかい音です。',x:()=>`<div class="opts" id="os"><button data-v="1">${ic('volume-2')}オン</button><button data-v="0">${ic('volume-x')}ミュート</button></div>`,b:'続ける',f(){tg('os',v=>{sound=v==='1';if(sound)pop(620)},v=>(v==='1')===sound)}},
{h:'リモート画面を有効にしますか',p:'OpenOSは最初からVNCで画面を共有できます。接続用のパスワードを決めてください。',x:()=>`<div class="opts" id="ov"><button data-v="1">${ic('monitor-up')}有効</button><button data-v="0">${ic('monitor-off')}無効</button></div><input id="pw" type="password" placeholder="パスワード(4文字以上)" autocomplete="new-password" aria-label="VNCパスワード">`,b:'続ける',f(){$('#pw').hidden=!vnc.on;tg('ov',v=>{vnc.on=v==='1';$('#pw').hidden=!vnc.on;if(vnc.on)$('#pw').focus()},v=>(v==='1')===vnc.on)},ok(){if(vnc.on&&$('#pw').value.length<4){toast('パスワードは4文字以上にしてください');$('#pw').focus();return false}vnc.pw=vnc.on;return true}},
{h:'準備ができました',get p(){return USER+'さん、OpenOSを始めましょう。'},b:'デスクトップへ'}];
const show=()=>{busy=0;const s=S[i];clearInterval(iv);sc.innerHTML=`<h1>${s.h}</h1>${s.p?`<p>${s.p}</p>`:''}${s.x?s.x():''}<button class="big">${s.b}${ic('arrow-right')}</button>`;stp.innerHTML=S.map((_,j)=>`<i${j<=i?' class="on"':''}></i>`).join('');gsap.fromTo(sc.children,{opacity:0,y:22},{opacity:1,y:0,duration:RM?0:.7,ease:'expo.out',stagger:.07});$('.big',sc).focus({preventScroll:true});if(s.f)s.f();$('.big',sc).onclick=next};
const next=()=>{if(busy)return;const s=S[i];if(s.ok&&!s.ok())return;busy=1;if(s.n)s.n();pop(560);if(i===S.length-1){clearInterval(iv);sync();save();qt.innerHTML='';APPS.term.r(qt);gsap.to(el,{opacity:0,duration:RM?0:.7,onComplete:()=>{el.remove();done()}});return}i++;gsap.to(sc.children,{opacity:0,y:-14,duration:RM?0:.2,onComplete:show})};
el.onkeydown=e=>{if(e.key==='Enter')next()};show()}
/* every operation is a command */
const A=x=>APPS[x]?x:Object.keys(APPS).find(k=>APPS[k].n===x),SN={left:'l',l:'l',right:'r',r:'r',max:'m',m:'m'};
const P=(a,f)=>{const id=A(a[0]);return id&&wins[id]?f(wins[id]):(a[0]||'?')+': 開いている窓がありません'};
const pre=t=>'<pre>'+t+'</pre>';
const CMD={
help:{d:'コマンド一覧',f:()=>pre(Object.entries(CMD).map(([k,v])=>k.padEnd(9)+v.d).join('\n'))},
open:{d:'open <app> アプリを開く',f:a=>A(a[0])?(open(A(a[0])),''):'open: '+Object.keys(APPS).join(' ')},
close:{d:'close <app|all> 閉じる',f:a=>a[0]==='all'?(Object.keys(wins).forEach(k=>$('.x',wins[k].el).click()),''):P(a,o=>($('.x',o.el).click(),''))},
min:{d:'min <app> 最小化',f:a=>P(a,o=>($('.m',o.el).click(),''))},
max:{d:'max <app> 最大化/戻す',f:a=>P(a,o=>($('.z',o.el).click(),''))},
snap:{d:'snap <app> left|right|max',f:a=>P(a,o=>SN[a[1]]?(snapTo(o,SN[a[1]]),''):'snap: left right max')},
move:{d:'move <app> <x> <y>',f:a=>P(a,o=>{o.x=+a[1]||0;o.y=Math.max(40,+a[2]||40);gsap.to(o.el,{x:o.x,y:o.y,duration:.5,ease:'expo.out'});return''})},
ws:{d:'ws <1-4> ワークスペース切替',f:a=>+a[0]>=1&&+a[0]<=4?(setWs(+a[0]-1),''):'ws: 1-4'},
send:{d:'send <app> <1-4> 窓を移動',f:a=>P(a,o=>{const n=+a[1]-1;if(!(n>=0&&n<4))return'send: 1-4';o.ws=n;if(n!==ws)gsap.to(o.el,{opacity:0,duration:.18,onComplete:()=>{if(o.ws!==ws)o.el.style.display='none'}});return''})},
win:{d:'窓の一覧',f:()=>pre(Object.keys(wins).map(k=>wins[k].pid+'  '+APPS[k].n+'  ws'+(wins[k].ws+1)+(wins[k].min?'  (最小化)':'')).join('\n')||'なし')},
theme:{d:'theme light|dark',f:a=>/^(light|dark)$/.test(a[0])?(setTheme(a[0]),save(),''):'theme: light dark'},
sound:{d:'sound on|off',f:a=>(sound=a[0]!=='off',sync(),save(),'')},
vnc:{d:'vnc on|off|status',f:a=>a[0]==='on'?(setVnc(true),vnc.pw?'':'パスワード未設定です。setup でやり直せます'):a[0]==='off'?(setVnc(false),''):'VNC: '+(vnc.on?'有効 openos.local:5900':'停止中')+(vnc.pw?' (パスワード設定済み)':'')},
setup:{d:'初期設定をやり直す',f:()=>(runSetup(()=>{}),'')},
qt:{d:'ドロップダウンターミナル',f:()=>(togQt(),'')},
reboot:{d:'再起動',f:()=>(location.reload(),'')},
poweroff:{d:'シャットダウン',f:()=>($('#pOff').click(),'')},
clear:{d:'画面を消す',f:()=>''},echo:{d:'echo <text>',f:()=>''},
date:{d:'日時',f:()=>new Date().toLocaleString('ja-JP')},
uname:{d:'OS情報',f:()=>'OpenOS 0.1 x86 (予定)'},
whoami:{d:'ユーザー名',f:()=>USER},
ls:{d:'ファイル',f:()=>'Documents  Pictures  memo.txt'},
browse:{d:'browse <URL|検索語> ブラウザで開く',f:a=>{open('web');if(a.length)setTimeout(()=>NET.go&&NET.go(a.join(' ')),60);return''}},
proxy:{d:'proxy <URL|off|status>',f:a=>!a[0]||a[0]==='status'?'proxy: '+(NET.px?NET.px.replace(/token=[^&]*/,'token=***'):'未設定(直接通信)'):a[0]==='off'?(setPx(''),''):/^https:\/\//.test(a[0])?(setPx(a[0]),''):'proxy: https://… か off'},
htop:{d:'モニタを開く',f:()=>(open('mon'),'')},
neofetch:{d:'システム情報',f:()=>pre(`${USER}@openos\n---------\nOS: OpenOS 0.1 (mockup)\nKernel: 自作 (予定)\nUptime: ${up()}\nWindows: ${Object.keys(wins).length}\nWorkspace: ${ws+1}/4\nTheme: ${document.documentElement.dataset.theme}\nVNC: ${vnc.on?'on':'off'}\nScreen: ${innerWidth}x${innerHeight}`)}};
const runCmd=l=>{const[c,...a]=l.trim().split(/\s+/);return CMD[c]?CMD[c].f(a):c?c+': command not found':''};
addEventListener('message',e=>{if(NET.fr&&NET.fr.isConnected&&e.source===NET.fr.contentWindow&&e.data&&typeof e.data.openos==='string')NET.go(e.data.openos)});
addEventListener('offline',()=>toast('オフラインです'));addEventListener('online',()=>toast('オンラインに戻りました'));
const boot=$('#boot'),ring=$('#boot svg');let done=false;
const end=()=>{if(done)return;done=true;gsap.to(boot,{opacity:0,duration:RM?0:.5,ease:'power2.out',onComplete:()=>{boot.remove();const go=()=>{open('files');setTimeout(()=>open('term'),150)};SS?go():runSetup(go)}})};
boot.onclick=end;
if(RM)end();else{gsap.from(ring,{scale:.8,opacity:0,duration:.9,ease:'expo.out'});gsap.from('#boot b',{y:8,opacity:0,duration:.8,delay:.25,ease:'expo.out'});gsap.to(ring,{rotate:360,duration:2.2,ease:'power2.inOut'});setTimeout(end,1900)}
</script>
